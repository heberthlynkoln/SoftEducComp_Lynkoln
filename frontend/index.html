<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visualizador de Análise Sintática</title>
  <style>
    :root { --bg: #f7f7f5; --fg: #1d2b2a; --muted: #5d6b6a; --ok: #1b6b4a; --erro: #a12c2c; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #14201f; --fg: #e8efee; --muted: #9db0ae; --ok: #6fd1a3; --erro: #ff8a8a; }
    }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid; place-items: center; padding: 1.5rem; box-sizing: border-box;
      background: var(--bg); color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 36rem; width: 100%; text-align: center; }
    h1 { font-size: clamp(2rem, 8vw, 3.25rem); margin: 0 0 .75rem; }
    p  { margin: .25rem 0; color: var(--muted); line-height: 1.5; }
    #status { font-weight: 600; }
    #status.ok   { color: var(--ok); }
    #status.erro { color: var(--erro); }
  </style>
</head>
<body>
  <main>
    <h1 id="mensagem">Carregando…</h1>
    <p id="status" role="status">Consultando o backend…</p>
    <p>Visualizador de análise sintática — Etapa 1</p>
  </main>

  <script>
    // O frontend chama /api/hello; o Nginx encaminha a chamada ao backend.
    const mensagem = document.getElementById('mensagem');
    const status = document.getElementById('status');

    fetch('/api/hello')
      .then(resposta => {
        if (!resposta.ok) throw new Error('HTTP ' + resposta.status);
        return resposta.json();
      })
      .then(dados => {
        mensagem.textContent = dados.message;
        status.textContent = 'Frontend e backend estão se comunicando.';
        status.className = 'ok';
      })
      .catch(() => {
        mensagem.textContent = 'Sem resposta do backend';
        status.textContent = 'Verifique se os contêineres estão ativos: docker compose ps';
        status.className = 'erro';
      });
  </script>
</body>
</html>
